# Option 2 (SENTINEL_MONITOR=process) auto-recovery. systemd authorizes
# `systemctl reset-failed` and `systemctl restart` with CAP_SYS_ADMIN when it
# can see the caller's capabilities (sd_bus_query_sender_privilege), and the
# base unit drops every capability, so this restores that one capability.
# Remove this drop-in (and set RECOVER_ENABLED=0) to keep Sentinel alert-only.
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN
