# Option 1 (SENTINEL_MONITOR=boinc). Installed only on BOINC hosts, because
# SupplementaryGroups= fails the unit (216/GROUP) where the boinc group is
# missing. The group lets boinccmd read gui_rpc_auth.cfg: the unit runs as root
# without capabilities, so root has no DAC override here.
[Unit]
After=boinc-client.service

[Service]
SupplementaryGroups=boinc
WorkingDirectory=-/var/lib/boinc-client
Environment=TOTAL_VCPUS=2
Environment=SAMPLE_SECONDS=10
Environment=CPU_THRESHOLD=30
